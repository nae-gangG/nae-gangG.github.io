<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>아직 만드는 중...</title>
  <!-- 귀여운 둥근 한글 폰트 (강원교육모두체) & Pretendard -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <style>
    @font-face {
      font-family: 'Cafe24SsurroundAir';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24SsurroundAir.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #FFFFFF;
      color: #111111;
      font-family: 'Cafe24SsurroundAir', "Pretendard Variable", sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
    }

    /* 앱 모드에서 메인으로 돌아가기 위한 좌측 상단 버튼 (햄버거 버튼과 동일한 위치) */
    .btn-back {
      position: fixed;
      top: calc(9px + env(safe-area-inset-top));
      left: 14px;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: 1.5px solid #111111;
      background: #FFFFFF;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      transition: transform 0.1s ease;
    }

    .btn-back:active {
      transform: scale(0.94);
      background: #F5F5F5;
    }

    .making-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .making-dots {
      display: flex;
      gap: 8px;
    }

    .making-dots span {
      width: 8px;
      height: 8px;
      background-color: #111111;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .making-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .making-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    .making-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #111111;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-7px);
      }
    }
  </style>
</head>
<body>
  <!-- 메인 스케줄러로 돌아가기 버튼 -->
  <a href="../index.html" class="btn-back" aria-label="돌아가기">←</a>

  <div class="making-box">
    <div class="making-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <p class="making-text">아직 만드는 중...</p>
  </div>
</body>
</html>
